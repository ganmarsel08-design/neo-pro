name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: npm ci
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Сборка воспроизводима, протоколы не изменены, цитаты дословны
        run: python -m pytest tests/test_static.py -q -p no:cacheprovider
      - name: Браузерные тесты на синтетических данных
        run: python -m pytest tests -q -p no:cacheprovider --ignore=tests/test_static.py
      - name: Матрица дефектов до/после (база — main)
        run: python tests/audit_matrix.py origin/main
